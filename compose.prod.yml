name: rubedo-prod

services:
  frontend:
    image: ${FRONTEND_IMAGE:-shiokou/redgal-frontend:latest}
    pull_policy: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - public
      - internal

  backend:
    image: ${BACKEND_IMAGE:-shiokou/redgal-backend:latest}
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      APP_NAME: "${APP_NAME:-rubedo-backend}"
      APP_ENV: "production"
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8080"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET}"
      AUTH_ALLOW_DEBUG_HEADERS: "false"
      AUTH_ALLOW_SCAFFOLD_LOGIN: "false"
      AUTH_SCAFFOLD_LOGIN_PASSWORD: "${AUTH_SCAFFOLD_LOGIN_PASSWORD:-disabled-in-production}"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rubedo}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/"
      MEILISEARCH_URL: "http://meilisearch:7700"
      MEILISEARCH_API_KEY: "${MEILISEARCH_MASTER_KEY:?set MEILISEARCH_MASTER_KEY}"
      BANGUMI_API_BASE_URL: "${BANGUMI_API_BASE_URL:-https://api.bgm.tv/v0}"
      BANGUMI_API_USER_AGENT: "${BANGUMI_API_USER_AGENT:-RubedoForum/2026 (+https://example.com; contact: admin@example.com)}"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-rubedo}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./DB/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-rubedo}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_ENV: "production"
      MEILI_MASTER_KEY: "${MEILISEARCH_MASTER_KEY:?set MEILISEARCH_MASTER_KEY}"
    volumes:
      - meilisearch-data:/meili_data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  meilisearch-data:

networks:
  public:
  internal:
    internal: true
