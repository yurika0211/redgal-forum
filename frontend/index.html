<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("rubedo_theme_mode");
          document.documentElement.setAttribute("data-theme", storedTheme === "day" ? "day" : "night");
        } catch {
          document.documentElement.setAttribute("data-theme", "night");
        }
      })();
    </script>
    <title>Rubedo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
